# Hidden files and directories (.git, .env, …).
location ~ (^|/)\. {
    return 404;
}

# Core's bundled text files (changelogs, licences) only aid version
# fingerprinting; robots.txt and friends at the site root stay served.
location ~ ^/core/.*\.txt$ {
    return 404;
}

# Source, template, backup, and dependency-manifest files that live inside
# the web root but must never be served.
location ~* \.(engine|inc|install|make|module|profile|po|sh|.*sql|theme|twig|tpl(\.php)?|xtmpl|yml)(~|\.sw[op]|\.bak|\.orig|\.save)?$|composer\.(json|lock)|web\.config|yarn\.lock|package\.json$|^(\.(?!well-known).*|Entries.*|Repository|Root|Tag|Template)$|^#.*#$|\.php(~|\.sw[op]|\.bak|\.orig|\.save)$ {
    deny all;
    return 404;
}
