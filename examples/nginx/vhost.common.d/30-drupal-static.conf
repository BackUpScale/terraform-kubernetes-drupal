# Long-lived caching for static assets; misses fall through to Drupal so
# aggregated CSS/JS and image derivatives are generated on demand.
location ~* \.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|avif|zip|swf)$ {
    try_files $uri @rewrite;
    expires max;
    log_not_found off;
    access_log off;
}
