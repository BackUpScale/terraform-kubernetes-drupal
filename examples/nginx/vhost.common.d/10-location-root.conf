location / {
    try_files $uri /index.php?$query_string;
}

location @rewrite {
    rewrite ^ /index.php;
}

# Image-style derivatives are generated by Drupal on first request.
location ~ ^/sites/.*/files/styles/ {
    try_files $uri @rewrite;
}

# Private files are streamed through Drupal's access control.
location ~ ^(/[a-z\-]+)?/system/files/ {
    try_files $uri /index.php?$query_string;
}
