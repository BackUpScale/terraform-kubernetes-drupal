# Only Drupal's entry points may reach PHP-FPM. Any other .php path --
# wherever it lives, the user-writable files directory included -- is a
# 404, so gaining a file write never gains code execution.
location ~ ^/(index|update|core/(install|rebuild|authorize))\.php(/|$) {
    fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
    try_files $fastcgi_script_name =404;
    fastcgi_pass php;
    include fastcgi_params;
    fastcgi_intercept_errors on;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_read_timeout 600;
}

location ~ \.php$ {
    return 404;
}
