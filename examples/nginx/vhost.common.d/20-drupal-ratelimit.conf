# Unauthenticated endpoints that send mail or consume one-time tokens:
# sign-up, password-reset request, and the emailed one-time-login links.
# A real person submits each a handful of times at most; burst 5 with
# nodelay leaves a double-submit unaffected. 429 above the limit, logged
# at warning for the pod-log alerting. /user/login is excluded: Drupal's
# flood control covers it, and it is the one path shared-IP users hit
# repeatedly.
location ~ ^/user/(register|password|reset)($|/) {
    limit_req zone=drupal_auth burst=5 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;
    try_files $uri /index.php?$query_string;
}
