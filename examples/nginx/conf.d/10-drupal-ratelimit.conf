# The TCP peer is the in-cluster gateway, so the rate-limit key must come
# from X-Forwarded-For. Only the rightmost entry is trusted: the gateway
# appends it to whatever the client sent, so it cannot be spoofed. Requests
# that arrive without the header (in-cluster calls) key on the peer itself.
# REMOTE_ADDR is deliberately left untouched (no realip): rewriting it would
# break the application's trusted-proxy handling of X-Forwarded-Proto.
map $http_x_forwarded_for $drupal_client_ip {
    default                   $remote_addr;
    "~(?<rightmost>[^,\s]+)$" $rightmost;
}

# Shared by the sign-up, password-reset, and one-time-login locations.
# 10 MB tracks on the order of 160k client addresses; the counter is
# per-pod, so replicas multiply the effective rate.
limit_req_zone $drupal_client_ip zone=drupal_auth:10m rate=5r/m;
