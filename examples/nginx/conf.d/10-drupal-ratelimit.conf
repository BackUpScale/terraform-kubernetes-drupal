# The TCP peer is the in-cluster gateway, so the rate-limit key must come
# from request headers. Without an edge proxy, only X-Forwarded-For's
# rightmost entry is trusted: the gateway appends it to whatever the client
# sent, so it cannot be spoofed. Requests that arrive without the header
# (in-cluster calls) key on the peer itself. REMOTE_ADDR is deliberately
# left untouched (no realip): rewriting it would break the application's
# trusted-proxy handling of X-Forwarded-Proto.
map $http_x_forwarded_for $drupal_forwarded_ip {
    default                   $remote_addr;
    "~(?<rightmost>[^,\s]+)$" $rightmost;
}

# Behind Cloudflare, the rightmost X-Forwarded-For entry is the edge
# address, which both pools unrelated visitors into shared buckets and
# spreads one attacker across many, so the key comes from
# CF-Connecting-IP instead. Trust precondition: this is only safe when the
# origin is firewall-locked to Cloudflare's ranges, making Cloudflare --
# which sets the header authoritatively -- the only possible sender on the
# public path; on an origin reachable directly, the header is
# client-forgeable and keying on it lets every request choose its own
# bucket. Headerless requests (a VPN-direct route, or a deployment without
# the edge proxy) fall back to the forwarded-address key above, keeping
# pre-Cloudflare behaviour.
map $http_cf_connecting_ip $drupal_client_ip {
    ""      $drupal_forwarded_ip;
    default $http_cf_connecting_ip;
}

# Shared by the sign-up, password-reset, and one-time-login locations.
# 10 MB tracks on the order of 160k client addresses; the counter is
# per-pod, so replicas multiply the effective rate.
limit_req_zone $drupal_client_ip zone=drupal_auth:10m rate=5r/m;
